name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Set up Python for native SQLite compatibility checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production SQLite migration, backup and restore in browser
        run: npm run test:browser
